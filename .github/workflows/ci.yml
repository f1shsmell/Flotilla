name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "**/*.md"
      - LICENSE
  pull_request:
    branches: [main]
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Error "gofmt required for: $($unformatted -join ', ')"
            exit 1
          }

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - run: go build ./...

      - run: go test ./...

      - name: coverage floor
        shell: bash
        run: bash scripts/check-coverage.sh

  gui:
    name: gui (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      # The GUI is tested headlessly, so the Electron binary is not needed here.
      # pnpm reads its settings from gui/pnpm-workspace.yaml, which is why this
      # job runs inside gui/ rather than with --dir.
      - name: install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      # The interop test needs a real daemon: it is the only check that the two
      # sides of the wire agree on framing and handshake.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build the daemon
        working-directory: ${{ github.workspace }}
        run: go build -o flt-daemon.exe ./cmd/flt-daemon

      - name: test
        env:
          FLT_DAEMON_BIN: ${{ github.workspace }}/flt-daemon.exe
        run: pnpm test

      # The window cannot keep a child alive: Task Scheduler starts the daemon
      # outside Electron's job object. This is the only check that the task path
      # works, and it needs a runner whose policy allows schtasks.
      - name: the launcher starts the daemon through a task
        env:
          FLT_DAEMON_BIN: ${{ github.workspace }}/flt-daemon.exe
        run: node scripts/check-launcher.mjs
