version: "2"

run:
  go: "1.27"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - unconvert
    - wastedassign
    - wrapcheck

  settings:
    errcheck:
      check-type-assertions: true
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: indent-error-flow
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration

  exclusions:
    rules:
      # Tests assert on logged and returned values directly; wrapped errors
      # would only obscure the failure.
      - path: _test\.go
        linters:
          - wrapcheck
          - errcheck

formatters:
  enable:
    - gofumpt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/f1shsmell/flotilla

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
